# Layer 2 observable manual testing — maps to docs/maintainers/planning/features/layer-2-observable/manual-testing.md
#
# Pi (Docker):  mise run l2-smoke
# Desk (Podman): copy mise.local.toml.example → mise.local.toml (gitignored), then mise run l2-smoke
#
# Requires .env at repo root. Browser-only steps: mise run l2-urls

[env]
L2_COMPOSE = "docker compose"

[tasks.l2-config]
description = "Scenario 1 — compose config validates"
run = "./scripts/l2-test.sh config"

[tasks.l2-up]
description = "Scenario 2 — stack up -d"
run = "./scripts/l2-test.sh up"

[tasks.l2-ps]
description = "Scenario 2 — compose ps"
run = "./scripts/l2-test.sh ps"

[tasks.l2-down]
description = "Stop observability stack"
run = "./scripts/l2-test.sh down"

[tasks.l2-prometheus-health]
description = "Scenario 3 — Prometheus /-/healthy"
run = "./scripts/l2-test.sh prometheus-health"

[tasks.l2-prometheus-targets]
description = "Scenario 3 — Prometheus targets (prometheus, pihole, docker, node) up"
run = "./scripts/l2-test.sh prometheus-targets"

[tasks.l2-exporters]
description = "Scenario 4 — exporter /metrics on 9617, 9713, 9100"
run = "./scripts/l2-test.sh exporters"

[tasks.l2-prometheus-rules]
description = "Scenario 7 — Prometheus alert rules (pihole_dns_incident)"
run = "./scripts/l2-test.sh prometheus-rules"

[tasks.l2-prometheus-alerts]
description = "Scenario 9 — list firing/ pending alerts (JSON)"
run = "./scripts/l2-test.sh prometheus-alerts"

[tasks.l2-urls]
description = "Print Grafana/Prometheus URLs for browser scenarios 5, 6, 8"
run = "./scripts/l2-test.sh urls"

[tasks.l2-stop-pihole]
description = "Scenario 9 — stop pihole container (incident preview)"
run = "./scripts/l2-test.sh stop-pihole"

[tasks.l2-start-pihole]
description = "Scenario 9 — recover pihole after incident"
run = "./scripts/l2-test.sh start-pihole"

[tasks.l2-smoke]
description = "Automated smoke: scenarios 1, 3, 4, 7 (stack must be running)"
depends = ["l2-config", "l2-prometheus-health", "l2-prometheus-targets", "l2-exporters", "l2-prometheus-rules"]
