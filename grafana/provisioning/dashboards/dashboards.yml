# Layer 2 spike — file provider for dashboard JSON (populated in Task 13).
apiVersion: 1

providers:
  - name: spike-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
