# Layer 2 spike — static scrape targets (see spike-outcomes.md § Group 2 handoff).
# Exporter hostnames resolve on the default Compose network after Task 8.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: pihole
    static_configs:
      - targets: ['pihole-exporter:9617']

  - job_name: docker
    scrape_interval: 15s
    static_configs:
      - targets: ['docker-exporter:9713']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
